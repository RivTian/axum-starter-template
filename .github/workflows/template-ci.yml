# CI of the template repository: every job calls a maintainer recipe from the justfile, and
# the combinations come from scripts/matrix.tsv.
name: template-ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Oldest supported and latest cargo-generate; `just compare` requires identical output.
  CG_MIN_VERSION: 0.24.0
  CG_LATEST_VERSION: 0.25.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just,actionlint
      - run: just lint

  setup:
    runs-on: ubuntu-latest
    outputs:
      combos: ${{ steps.matrix.outputs.combos }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          combos="$(python3 -c 'import csv, json; print(json.dumps([r["id"] for r in csv.DictReader(open("scripts/matrix.tsv"), delimiter="\t")]))')"
          echo "combos=$combos" >> "$GITHUB_OUTPUT"

  matrix:
    needs: [lint, setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJSON(needs.setup.outputs.combos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-machete,typos,cargo-deny,actionlint
      - uses: actions/cache@v4
        with:
          path: ~/.cg
          key: cargo-generate-${{ runner.os }}-${{ env.CG_MIN_VERSION }}-${{ env.CG_LATEST_VERSION }}
      - name: Install cargo-generate
        run: |
          for version in "$CG_MIN_VERSION" "$CG_LATEST_VERSION"; do
            if [ ! -x "$HOME/.cg/$version/bin/cargo-generate" ]; then
              cargo install --locked --quiet cargo-generate --version "$version" --root "$HOME/.cg/$version"
            fi
          done
          echo "CG=$HOME/.cg/$CG_LATEST_VERSION/bin/cargo-generate" >> "$GITHUB_ENV"
      # The full check: the generated project's own `just check`, MSRV, console, smoke runs,
      # the release archive, the lock-file errors and, for combinations with a Dockerfile,
      # the image build and smoke test (the runner has Docker).
      - name: Full check of ${{ matrix.combo }}
        env:
          COMBO: ${{ matrix.combo }}
        run: just full "$COMBO"

  compare:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/cache@v4
        with:
          path: ~/.cg
          key: cargo-generate-${{ runner.os }}-${{ env.CG_MIN_VERSION }}-${{ env.CG_LATEST_VERSION }}
      - name: Install cargo-generate
        run: |
          for version in "$CG_MIN_VERSION" "$CG_LATEST_VERSION"; do
            if [ ! -x "$HOME/.cg/$version/bin/cargo-generate" ]; then
              cargo install --locked --quiet cargo-generate --version "$version" --root "$HOME/.cg/$version"
            fi
          done
          {
            echo "CG_MIN=$HOME/.cg/$CG_MIN_VERSION/bin/cargo-generate"
            echo "CG_LATEST=$HOME/.cg/$CG_LATEST_VERSION/bin/cargo-generate"
          } >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: just compare && just names

  version-info:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/cache@v4
        with:
          path: ~/.cg
          key: cargo-generate-${{ runner.os }}-${{ env.CG_MIN_VERSION }}-${{ env.CG_LATEST_VERSION }}
      - name: Install cargo-generate
        run: |
          for version in "$CG_MIN_VERSION" "$CG_LATEST_VERSION"; do
            if [ ! -x "$HOME/.cg/$version/bin/cargo-generate" ]; then
              cargo install --locked --quiet cargo-generate --version "$version" --root "$HOME/.cg/$version"
            fi
          done
          echo "CG=$HOME/.cg/$CG_LATEST_VERSION/bin/cargo-generate" >> "$GITHUB_ENV"
      - run: just version-info
