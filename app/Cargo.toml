[package]
name = "{{crate_prefix}}-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "{{crate_name}}"
path = "src/main.rs"

[dependencies]
service-core.workspace = true
service-api.workspace = true
service-storage.workspace = true
service-worker.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
tokio-util.workspace = true
serde.workspace = true
serde_path_to_error.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
tempfile.workspace = true

# A test fixture built with the real release profile, not the test harness.
# release-check runs it and validates its intentional failure exit; normal service startup does not.
[[example]]
name = "release-panic-fixture"
path = "tests/fixtures/release_panic.rs"
test = false
bench = false
