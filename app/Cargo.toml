[package]
name = "{{crate_prefix}}-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "{{crate_name}}"
path = "src/main.rs"

[dependencies]
service-core.workspace = true
service-api.workspace = true
service-storage.workspace = true
service-worker.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
tokio-util.workspace = true
serde.workspace = true
serde_path_to_error.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
tempfile.workspace = true

[[example]]
name = "m1-release-panic"
path = "examples/m1_release_panic.rs"
