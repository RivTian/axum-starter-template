# 服务配置。
#
# 首次启动时，如果安装根下的默认位置没有这个文件，进程会把这一份原样写出来。
# 写出来的内容与程序内置的默认值**逐字段相等**：删掉整个文件重启，行为不变。
#
# 相对路径一律锚在**安装根**（可执行文件所在目录的父目录），而不是当前工作目录，
# 也不是这个文件所在的目录。于是从哪里启动进程都不影响它去哪里找数据。
#
# 被注释掉的键表示"用内置默认值"。取消注释并改值即可覆盖。
#
# 环境变量展开发生在 TOML 解析**之前**，作用于整份文件的文本——**注释也一样会被展开**。
# 值里可以写 $${NAME} 或 $${NAME:默认值}。上面两处开头之所以是两个美元符号：单个美元
# 符号就是展开标记，写在注释里同样算数，要表示字面量就得连写两个。这是本文件里唯一
# 一处"注释也会影响行为"的地方。
# 只认这两种形式，别的一律报错而不是原样放过——一个原样留在配置里的 $${A:-b} 能耗掉
# 半天排查。

[http]
# 监听地址。改它需要重启。
# 默认是回环地址：一份刚生成的服务不该在第一次启动时就对整个局域网开着。
bind_addr = "127.0.0.1:8080"

# 单个请求的处理超时。改了立刻生效，每个请求现读。
# 超时返回 504，响应体仍然是统一错误信封。
handler_timeout = "15s"

# 请求体上限（字节）。装在路由上，改了要等 HTTP 面重启。
body_limit_bytes = 1048576

# 这个面跑在哪个附加 runtime 上。不写 = 主 runtime。改它需要重启。
# 名字必须是 [runtime.extra.*] 里声明过的。
# runtime = "io"

[storage]
# 数据库文件。相对路径锚到安装根。
path = "data/service.sqlite3"

# 读连接数。
# 没有"写连接数"这个旋钮：SQLite 同一时刻只允许一个写者，写池固定为 1 是它的
# 物理性质，做成配置项等于邀请别人去调一个调了就出错的数。
max_readers = 4

# 遇到锁时在放弃前等多久（交给 SQLite 自己重试）。
busy_timeout = "5s"

# 从连接池里取一条连接的等待上限。
acquire_timeout = "10s"

[worker]
# 是否启用后台 worker 面。改它要等面重启。
enabled = true

# tick 间隔。**改了立刻生效**——每一 tick 结束后现读下一次的间隔。
# 这是本模板里唯一一个改了就能立刻观察到效果的旋钮。
tick_interval = "30s"

# 同 http.runtime。
# runtime = "io"

[runtime]
# 主 runtime 的工作线程数。不写 = 按可用并行度定。
# worker_threads = 8

# 阻塞线程池上限。不写 = Tokio 默认。
# max_blocking_threads = 512

# 附加 runtime。默认一个都不建——多开一个 runtime 就是多一组工作线程、
# 多一次跨 runtime 调度，只有在已经量到"某个面的 CPU 占用抬高了别的面的尾延迟"
# 之后才值得。声明了就必须有面引用它，否则启动直接失败。
# [runtime.extra.io]
# worker_threads = 2

[shutdown]
# 整个关停过程的硬上界。下面每一段都不得越过它。
total_grace = "30s"

# 第一段：等需要优雅收尾的面自己结束（HTTP 面把在途请求做完）。
harvest = "10s"

# 第二段：abort 剩下的任务，然后回收。
reap = "5s"

# 第三段：关存储连接池。
storage_close = "5s"

# 第四段：关 runtime。发生在主循环返回之后。
runtime_shutdown = "5s"

# 收到第二次停止请求时，把总边界收紧到"现在 + 这个值"。
# 第三次直接立刻退出。
escalate = "2s"

[telemetry]
# 日志过滤器，语法同 RUST_LOG（例如 "info,service_api=debug"）。
# 写错了会退回 "info" 并留下一条 warn，不会静默。
# 注意：进程**不**读 RUST_LOG——真值只有这一处。
filter = "info"

# 日志格式："text" 或 "json"。
# 着色只由"stderr 是不是终端"决定，与这个键无关。
format = "text"
