# Local development only: port 0 asks the OS for an available port.
# The actual address is logged after all tasks confirm initialization.
[http]
listen = "127.0.0.1:0"
request_timeout_ms = 2000
ready_probe_timeout_ms = 500

[storage]
# Relative to this configuration file's directory, never the executable directory.
path = "../data/service.sqlite3"
min_connections = 0
max_connections = 4
acquire_timeout_ms = 2000
busy_timeout_ms = 1000

[ticker]
interval_ms = 1000

[runtime]
# worker_threads omitted: use the startup snapshot of available parallelism.
max_blocking_threads = 16

[lifecycle]
startup_timeout_ms = 10000
# A timed-out reload keeps its blocking slot until the original job finishes.
reload_timeout_ms = 2000
grace_ms = 5000
abort_reap_ms = 1000
storage_close_ms = 3000
runtime_shutdown_ms = 1000
