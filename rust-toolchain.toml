# 模板仓库自己的工具链。**不进生成结果**——见 `cargo-generate.toml` 的 `ignore`，
# 以及 `hooks/post.rhai` 的 `assert_absent`（它在用户侧复核这条确实生效了）。
#
# ## 为什么模板仓库要钉死（DP6 的前半）
#
# 模板的门禁里有两样东西对工具链版本敏感：逐字节比较，和 `cargo fmt --check`。
# rustfmt 的输出会随版本变，clippy 的 lint 集合也会随版本变。钉死之后，"门禁红了"
# 只可能是有人改了东西，不会是工具链自己动了——这正是门禁的价值所在。
#
# ## 为什么生成结果不带（DP6 的后半）
#
# 把它交给用户，等于替他做一个会过期的决定：项目活三年，这行数字就钉三年，而第一个
# 想升级的人会发现升级要先读懂模板当初为什么钉在这里。生成结果只在
# `[workspace.package]` 里声明 `rust-version`——那是**下界**，不是钉死。
#
# 残留代价是 R7：用户本机的 rustfmt 版本一变，`cargo fmt --check` 可能在没有改任何
# 代码的情况下见红。这条代价写在生成结果的 README「门禁」一节里，没有藏。
#
# ## 版本为什么是这一个
#
# 本模板全部实测数字——240 / 244 条测试全绿、clippy `-D warnings` 干净、锁定 189 个
# 包、doctest 计数 0——都是在 1.95.0 下量出来的。钉一个没量过的版本，等于声称一件
# 没验过的事（§11）。换版本的正确做法是：先在新版本下把 `make check` 跑绿，再改这里。

[toolchain]
channel = "1.95.0"

# `minimal` 只装 rustc / cargo / rust-std，再由下面一行显式补两个门禁真正用到的组件。
# 不用 `default` 是因为它会连带 rust-docs 等门禁一次都不碰的东西。
profile = "minimal"
components = ["rustfmt", "clippy"]
