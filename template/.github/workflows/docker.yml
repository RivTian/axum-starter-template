# The container image: built and smoke-tested on pushes to main and on pull requests;
# on a version tag also pushed to GitHub Container Registry.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          # Registry names must be lower case; the owner may not be.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "$image:$GITHUB_SHA" .
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 "$IMAGE:$GITHUB_SHA"
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && break
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy
          curl -fsS http://127.0.0.1:8080/readyz
          docker logs smoke | grep -F "\"git_sha\":\"$GITHUB_SHA\""
          mkdir notices && docker cp smoke:/usr/share/doc/. notices/
          cmp notices/*/THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES.md
          if [ -f LICENSE ]; then cmp notices/*/LICENSE LICENSE; fi
          docker stop --time 30 smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0
      - name: Push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:$GITHUB_REF_NAME"
