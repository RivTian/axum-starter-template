[package]
name = "{{project-name}}"
description = "The service binary and its composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
{% if license != "None" -%}
license.workspace = true
{% endif -%}
publish.workspace = true

[lib]
name = "svc_app"

[[bin]]
name = "{{project-name}}"
path = "src/main.rs"

[dependencies]
{{project-name}}-api.workspace = true
{{project-name}}-config.workspace = true
{{project-name}}-domain.workspace = true
{{project-name}}-infra.workspace = true
{{project-name}}-runtime.workspace = true
{{project-name}}-telemetry.workspace = true
{{project-name}}-util.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio.workspace = true
tracing.workspace = true

[build-dependencies]
vergen-gitcl.workspace = true

[dev-dependencies]
cargo_metadata.workspace = true
serde_json.workspace = true
toml.workspace = true

[features]
# tokio-console support; build with RUSTFLAGS="--cfg tokio_unstable".
console = ["{{project-name}}-telemetry/console"]

# cargo-machete reads only the lib, bin and test targets, not build.rs.
[package.metadata.cargo-machete]
ignored = ["vergen-gitcl"]

[lints]
workspace = true
