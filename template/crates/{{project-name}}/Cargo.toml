[package]
name = "{{project-name}}"
description = "The service binary and its composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
{% if license != "None" -%}
license.workspace = true
{% endif -%}
publish.workspace = true

[lib]
name = "svc_app"

[[bin]]
name = "{{project-name}}"
path = "src/main.rs"

[dependencies]
{{project-name}}-api.workspace = true
{{project-name}}-domain.workspace = true
{{project-name}}-infra.workspace = true
{{project-name}}-runtime.workspace = true
{{project-name}}-telemetry.workspace = true
{{project-name}}-util.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
cargo_metadata.workspace = true
toml.workspace = true

[lints]
workspace = true
