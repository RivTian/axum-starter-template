# cargo-deny: licenses, security advisories and sources of the dependencies (`just deny`).

[graph]
# Include the optional console feature, so that its dependencies are checked too.
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
# Some allowed licenses are not in use yet; keep them for common dependencies.
unused-allowed-license = "allow"
confidence-threshold = 0.8

[licenses.private]
# The workspace's own crates are not published.
ignore = true

[bans]
# No crate is banned here: which crates the members may use directly is checked by the
# architecture test (crates/{{project-name}}/tests/architecture.rs), and dependencies may use
# anything else internally.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
